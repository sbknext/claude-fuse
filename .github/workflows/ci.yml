name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate
        run: npm run migrate

      - name: Test (api)
        run: npm test -w api

      - name: Test (collector)
        run: npm test -w collector

      - name: Test (dashboard)
        run: npm test -w dashboard

      - name: Build dashboard
        run: npm run build -w dashboard
